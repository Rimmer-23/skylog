name: Deploy
on:
  push:
    branches: [main]

# Least privilege: the workflow only needs to read the repository
permissions:
  contents: read

# Never run two deploys against the server at once; a newer push waits for the current one
concurrency:
  group: deploy
  cancel-in-progress: false

# Third-party actions are pinned to commit SHAs; Dependabot keeps them updated
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ruff
        run: pipx run --spec ruff==0.17.0 ruff check pipeline

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./pipeline
          platforms: linux/amd64
          push: true
          # :latest is what the server pulls; the commit tag allows pinning a known-good image to roll back
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/skylog-pipeline:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/skylog-pipeline:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd ~/skylog
            git pull origin main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            bash scripts/create-grafana-ro.sh
            docker image prune -f
