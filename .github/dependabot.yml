version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker          # pipeline/Dockerfile base image
    directory: /pipeline
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose  # postgres / grafana image tags
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A PostgreSQL major upgrade cannot reuse the existing data volume:
      # it needs pg_dump/pg_restore (or pg_upgrade), so never auto-bump it.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip             # pipeline/requirements.txt
    directory: /pipeline
    schedule:
      interval: weekly
